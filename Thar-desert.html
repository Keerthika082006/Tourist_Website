<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thar Desert</title>
<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #0d0d0d;
        color: #eee;
        overflow-x: hidden;
    }
    header {
        height: 90vh;
        background: url('RR10.jpg') center/cover no-repeat fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
    }
    header::after {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.5);
    }
    h1 {
        z-index: 5;
        font-size: 4rem;
        color: #ffdd66;
        text-shadow: 0 0 20px #ffcc33;
        animation: neon 2.5s infinite alternate;
    }
    @keyframes neon {
        from { text-shadow: 0 0 10px #ffcc33; }
        to { text-shadow: 0 0 35px #ffaa00; }
    }
    .section {
        padding: 60px;
        text-align: center;
        opacity: 0;
        transform: translateY(25px);
        transition: .8s ease;
    }
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 40px;
    }
    .gallery img {
        width: 100%;
        border-radius: 10px;
        filter: brightness(0.8);
        transition: .3s;
        height: 350px;
    }
    .gallery img:hover {
        filter: brightness(1);
        transform: scale(1.05);
    }
</style>
</head>
<body>
<header>
    <h1>Thar Desert</h1>
</header>
<section class="section">
    <h2>Endless Sands</h2>
    <p>Experience the golden dunes, desert adventures, and camel treks.</p>
</section>
<div class="gallery">
    <img src="RR11.jpg" />
    <img src="RR12.jpg" />
    <img src="RR13.jpg" />
    <img src="RR10.jpg" />
</div>
<script>
    const sections = document.querySelectorAll('.section');
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting){
                entry.target.style.opacity = 1;
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, { threshold: 0.2 });
    sections.forEach(sec => observer.observe(sec));
</script>
</body>
</html>
