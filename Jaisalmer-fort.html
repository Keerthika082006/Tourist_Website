<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jaisalmer Fort</title>
<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #fff8e1;
        overflow-x: hidden;
    }
    header {
        height: 90vh;
        background: url('RR9.jpg') center/cover no-repeat fixed;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        position: relative;
        color: white;
    }
    header::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.45);
    }
    h1 {
        font-size: 4rem;
        z-index: 2;
        text-shadow: 0px 0px 20px #ffcc00;
        animation: glow 3s infinite ease-in-out;
    }
    @keyframes glow {
        0% { text-shadow: 0 0 10px #ffcc00; }
        50% { text-shadow: 0 0 25px #ff9900; }
        100% { text-shadow: 0 0 10px #ffcc00; }
    }
    .section {
        padding: 60px;
        text-align: center;
        animation: fadeIn 1.5s ease forwards;
        opacity: 0;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        padding: 40px;
    }
    .gallery img {
        width: 100%;
        border-radius: 15px;
        transition: transform .4s ease, box-shadow .4s ease;
        height:200px
    }
    .gallery img:hover {
        transform: scale(1.07) rotate(1deg);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }
</style>
</head>
<body>
<header>
    <h1>Jaisalmer Fort</h1>
</header>
<section class="section">
    <h2>The Golden Fort</h2>
    <p>Explore the living fort of Rajasthan glowing in desert sunlight.</p>
</section>
<div class="gallery">
    <img src="RR5.jpg" width="150"/>
    <img src="RR6.jpg" />
    <img src="RR7.jpg" />
    <img src="RR8.jpg" />
</div>
<script>
    const sections = document.querySelectorAll('.section');
    const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
            if(entry.isIntersecting) entry.target.style.opacity = 1;
        });
    }, { threshold: 0.2 });
    sections.forEach(sec => observer.observe(sec));
</script>
</body>
</html>
